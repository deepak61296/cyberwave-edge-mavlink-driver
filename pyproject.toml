[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cyberwave-edge-mavlink-driver"
version = "0.1.0"
description = "MAVLink edge driver for ArduPilot and PX4 aircraft (SITL and real). Speaks the standard Cyberwave drone command contract."
requires-python = ">=3.11"
dependencies = [
    "cyberwave-sdk>=0.1.0",
]
authors = [
    {name = "Deepak Popli"},
]

[project.scripts]
driver = "cyberwave_edge_mavlink_driver.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cyberwave_edge_mavlink_driver*"]
