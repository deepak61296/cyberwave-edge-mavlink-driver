name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      # Only test_unit_*.py is collected; pyproject says why. The rest of
      # tests/ moves a real aircraft at import time.
      - name: Unit tests
        run: python -m pytest -q

      # The conformance run against the in-repo simulated vehicle goes here,
      # once feature/sim-vehicle merges. It needs no flight controller and no
      # network, so it belongs in this job rather than a new one.

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cyberwave-edge-mavlink-driver:ci .
      # Cheap proof the image can import itself: with no key and no twin the
      # driver must say so and exit non-zero, which is the contract Edge Core
      # and systemd both restart on.
      - name: It starts and asks for its environment
        run: |
          if docker run --rm cyberwave-edge-mavlink-driver:ci; then
            echo "expected a non-zero exit with no environment"; exit 1
          fi
